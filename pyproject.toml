[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "stewart"
dynamic = ["version"]
description = "Local custody for bounded audits of Git projects"
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE"}
dependencies = []

[tool.hatch.version]
path = "src/stewart/_version.py"

[tool.hatch.build]
ignore-vcs = true
exclude = ["**/__pycache__", "**/*.pyc", "**/.pytest_cache", "/.scratch"]

[tool.hatch.build.targets.wheel]
packages = ["src/stewart"]

[tool.hatch.build.targets.wheel.shared-scripts]
"src/stewart/resources/stewart" = "stewart"
"src/stewart/resources/_stewart-python" = "_stewart-python"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/pyproject.toml", "/README.md", "/AGENTS.md", "/COORDINATOR-HANDOFF.md", "/DEVELOPMENT.md", "/riker/RIKER.md", "/riker/THREAD-ONRAMP-TEMPLATE.md", "/LICENSE", "/requirements.lock", "/.gitignore"]
# Prune excluded directories instead of walking them; retained runs under .scratch are large.
skip-excluded-dirs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "system: exercises external executables or host capabilities",
    "heavy: longer running behavioral checks",
    "serial: owns a shared host resource",
    "smoke: inexpensive contract or import checks",
]
